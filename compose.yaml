services:
  db:
    image: postgres:16-alpine
    container_name: clinic-appointments-postgres
    environment:
      POSTGRES_DB: clinic_appointments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_appointments"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clinic_appointments_postgres_data:/var/lib/postgresql/data

volumes:
  clinic_appointments_postgres_data:
