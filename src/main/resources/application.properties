spring.application.name=clinic-appointment-api
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/clinic_appointments}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns schema changes; Hibernate only verifies that entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Production signing material must be supplied through the environment.
clinic.security.jwt.secret=${JWT_SECRET:}
clinic.security.jwt.issuer=${JWT_ISSUER:clinic-appointment-api}
clinic.security.jwt.access-token-ttl=30m

# OpenAPI schemas reject undeclared JSON fields.
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
