spring.application.name=clinic-appointment-api
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/clinic_appointments}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns schema changes; Hibernate only verifies that entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
